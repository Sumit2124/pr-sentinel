[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-sentinel"
version = "0.1.0"
description = "Multi-Agent AI Code Reviewer & PR Auto-Fixer Bot"
readme = "README.md"
authors = [{ name = "AI Projects Contributor" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "gitpython>=3.1.42",
    "unidiff>=0.7.5",
    "pygithub>=2.3.0",
    "litellm>=1.35.0",
    "streamlit>=1.33.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
]

[project.scripts]
pr-sentinel = "pr_sentinel.cli:app"
